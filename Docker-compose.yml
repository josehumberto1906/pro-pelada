version: '3.8'

services:
  # 1. Base de Dados (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: propelada_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: propelada
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Back-end (A tua API Node.js)
  api:
    build: ./backend
    container_name: propelada_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://admin:adminpassword@db:5432/propelada?schema=public"
    depends_on:
      - db

  # 3. Front-end (O teu HTML/JS a correr no Nginx)
  propelada_frontend:
    image: nginx:alpine
    container_name: propelada_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  pgdata: